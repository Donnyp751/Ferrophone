# SPDX-License-Identifier: GPL-2.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  PKG_CONFIG_PATH: ${{ github.workspace }}/third_party/prefix/lib/pkgconfig

jobs:
  build:
    name: Build and test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libclang-dev \
            libssl-dev libopus-dev libasound2-dev libpulse-dev uuid-dev

      - name: Cache pjproject
        uses: actions/cache@v4
        with:
          path: third_party/prefix
          key: pjproject-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-pjproject.sh', 'third_party/pjproject/**') }}

      - name: Build pjproject
        run: scripts/build-pjproject.sh

      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Unit tests
        run: cargo test --workspace

      - name: Start test PBX
        run: docker compose -f tests/interop/docker-compose.yml up -d --wait
      - name: Interop tests
        env:
          FERROPHONE_INTEROP_HOST: 127.0.0.1
        run: cargo test --workspace --features ferro-engine/interop -- --test-threads=1
      - name: PBX logs on failure
        if: failure()
        run: docker compose -f tests/interop/docker-compose.yml logs asterisk

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources bans advisories
