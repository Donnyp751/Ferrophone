[general]
static=yes
writeprotect=yes

[phones]
; Extension to extension, with a BLF hint per extension (FR-14).
exten => _100[1-8],hint,PJSIP/${EXTEN}
exten => _100[1-8],1,Dial(PJSIP/${EXTEN},20)
 same => n,VoiceMail(${EXTEN}@default,u)
 same => n,Hangup()

; Voicemail access (FR-15).
exten => *97,1,VoiceMailMain(${CALLERID(num)}@default,s)

; Echo test and a 1 kHz tone for audio checks (FR-38).
exten => 600,1,Answer()
 same => n,Echo()
exten => 601,1,Answer()
 same => n,Playtones(1000/0)
 same => n,Wait(30)
 same => n,Hangup()

; Directed pickup of a ringing extension (FR-14): **<ext>.
exten => _**100[1-8],1,Pickup(${EXTEN:2}@phones)
