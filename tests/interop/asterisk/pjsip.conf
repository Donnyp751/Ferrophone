; Test PBX for Ferrophone CI. Not for production: one shared test secret.
; Extensions 1001-1008. Each has a BLF hint and a voicemail box (FR-14, FR-15).

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[phone](!)
type=endpoint
context=phones
disallow=all
allow=opus,g722,ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
allow_subscribe=yes
subscribe_context=phones

[phone-auth](!)
type=auth
auth_type=userpass
password=ferrophone-test

[phone-aor](!)
type=aor
max_contacts=1
remove_existing=yes

[1001](phone)
auth=1001
aors=1001
mailboxes=1001@default
[1001](phone-auth)
username=1001
[1001](phone-aor)
mailboxes=1001@default

[1002](phone)
auth=1002
aors=1002
mailboxes=1002@default
[1002](phone-auth)
