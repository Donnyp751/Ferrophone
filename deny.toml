# SPDX-License-Identifier: GPL-2.0-or-later
# NFR-14: binaries ship under GPL-3.0 (D-02), so every dependency must be
# GPL-3.0 compatible.

[graph]
all-features = true

[licenses]
allow = [
    "GPL-2.0-or-later",
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "MPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.9
# The list covers future dependencies (Tauri, audio crates) too.
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are publish = false; they are GPL-2.0-or-later.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/Lake-Country-Embedded/pjsua-rust.git"]

[advisories]
yanked = "deny"
